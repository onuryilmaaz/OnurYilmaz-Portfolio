# Portfolio routing for onur-yilmaz.com
#
# The existing backend keeps owning every path by default (its `location /`).
# Only the paths the portfolio needs are sent to Next.js on 127.0.0.1:3100.
# When the backend is retired, point `location /` at the portfolio upstream instead.

# --- 1) Put this at the top level of the site file (outside any server block) ---

upstream portfolio {
    server 127.0.0.1:3100;
    keepalive 16;
}

# --- 2) Put these inside the existing `server { ... }` block for onur-yilmaz.com,
#        next to the backend's `location /`. Leave the backend's block as it is. ---

# Home page
location = / {
    include /etc/nginx/snippets/portfolio-proxy.conf;
}

# Next.js bundles, fonts and optimized images. ^~ stops regex locations from catching these.
location ^~ /_next/ {
    include /etc/nginx/snippets/portfolio-proxy.conf;
}

# Contact form endpoint
location = /api/email {
    include /etc/nginx/snippets/portfolio-proxy.conf;
}

# Files from the repo's public/ folder. Add new public files here.
location ~ ^/(CV\.pdf|pp\.jpg|salah\.jpg|favicon\.ico)$ {
    include /etc/nginx/snippets/portfolio-proxy.conf;
}
